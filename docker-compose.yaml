services:
  sombrero:
    image: "sombrero:${TAG:-dev}"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 9292:9292
    volumes:
      - .:/app:cached
    environment:
      TZ: Asia/Tokyo
      HOST: 0.0.0.0
      PORT: 9292
      RACK_ENV: ${RACK_ENV:-development}
    tty: true
    restart: unless-stopped
